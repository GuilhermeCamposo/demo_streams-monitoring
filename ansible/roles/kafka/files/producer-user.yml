apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: producer
  labels:
    strimzi.io/cluster: my-cluster
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: a_quotes
          patternType: literal
        operations: 
          - Read
          - Describe
        host: "*"
      - resource:
          type: group
          name: a_group
          patternType: literal
        operations: 
          - Read
        host: "*"
      - resource:
          type: topic
          name: a_quote_requests
          patternType: literal
        operations: 
          - Write
          - Describe
        host: "*"
      - resource:
          type: topic
          name: movies
          patternType: literal
        operations: 
          - Write
          - Describe
        host: "*"
# ACLs for Kafka Connect        
      - resource:
          type: topic
          name: connect-cluster-offsets
          patternType: literal
        operations: 
          - Read
          - Write 
          - Create 
          - Describe
          - DescribeConfigs
        host: "*"
      - resource:
          type: topic
          name: connect-cluster-configs
          patternType: literal
        operations:
          - Read
          - Write 
          - Create 
          - Describe
          - DescribeConfigs
        host: "*"
      - resource:
          type: topic
          name: connect-cluster-status
          patternType: literal
        operations:
          - Read
          - Write 
          - Create 
          - Describe
          - DescribeConfigs
        host: "*"
      - resource:
          type: group
          name: connect-cluster
          patternType: literal
        operations: 
          - Read
        host: "*"        