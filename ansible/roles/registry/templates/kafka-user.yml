apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: apicurio-user
  labels:
    strimzi.io/cluster: {{ streams_kafka_cluster_name }}
spec:
  authentication:
    type: scram-sha-512
  authorization:
    acls:
    - operations:
        - All
      resource:
        name: kafkasql-journal
        patternType: literal
        type: topic
    - operations:
        - All
      resource:
        name: kafkasql-snapshots
        patternType: literal
        type: topic
    - operations:
        - All
      resource:
        name: registry-events
        patternType: literal
        type: topic
    - operations:
        - All
      resource:
        name: apicurio-registry-
        patternType: prefix
        type: group
    - operations:
        - All
      resource:
        name: apicurio-
        patternType: prefix
        type: group        
    type: simple



  