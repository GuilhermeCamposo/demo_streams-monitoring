---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: kafkasql-journal
  labels:
    strimzi.io/cluster: {{ streams_kafka_cluster_name }}
spec:
  partitions: 2
  replicas: 1
  config:
     retention.ms: -1
     retention.bytes: -1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: kafkasql-snapshots
  labels:
    strimzi.io/cluster: {{ streams_kafka_cluster_name }}
spec:
  partitions: 2
  replicas: 1
  config:
     retention.ms: -1
     retention.bytes: -1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: registry-events
  labels:
    strimzi.io/cluster: {{ streams_kafka_cluster_name }}
spec:
  partitions: 2
  replicas: 1
  config:
     retention.ms: -1
     retention.bytes: -1         